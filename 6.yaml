  source: 山风山风等等我
  uuid: 8339ada2-4859-4b3c-a5d3-3a8a1a013606
- author: null
  character: null
  content: 我喜欢你，比这个世界上其他任何人都喜欢你，我永远都会喜欢你的。只有我的这份心情是不会输给任何人的，即使我的这个身体毁灭了、从世界上消失了，来世我肯定还是会喜欢上你的。
