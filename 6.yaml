- author: null
  character: null
  content: 现实与理想相差了十万八千里,我马不停蹄,却也鞭长莫及。
  created_at: 2021-10-05 15:44:58
  source: 听《稻香》时的一些感慨
  uuid: c0b57851-40c9-46e9-a0c7-36ef47dc2106
- author: 王健美
  character: null
  content: 何必满腹心酸，委屈地承受。
