  content: 我们这群人，苦没有真正苦过，爱没有用力爱过。 每天受着信息大潮的冲击，三观未定又备受曲折。 贫穷不再是正义，又妄图不让金钱成为唯一的追求。 过早看到了更大的世界，勤奋却又不过三天。
