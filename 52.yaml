chunk_id: 52
sentences:
- author: 杜耒
  character: null
  content: 寒夜客来茶当酒，竹炉汤沸火初红。
  created_at: 2020-04-09 10:14:51
  source: 寒夜
  uuid: a80faa05-e166-4da4-a416-979f40806f34
- author: 汪苏泷
  character: null
  content: 没有海洋没有陆地。
  created_at: 2026-08-29 23:03:55
  source: 就让这大雨全都落下
  uuid: 8f524a95-cffc-4644-ae93-e380528e7034
- author: null
  character: null
  content: 这永远闪光的梦想，穿过每一个清晨，每一个不眠夜晚。
  created_at: 2019-04-15 22:18:05
  source: 许巍·无尽光芒
  uuid: 4064dd95-b387-406c-8f14-8caee5244134
- author: null
  character: null
  content: 被爱可以放肆大笑，因为没有付出。而爱却是沉默哑言，因为感同身受。
  created_at: 2023-04-16 22:33:05
  source: 网络
  uuid: 80399fa5-8e92-4192-aab7-1c3739917634
- author: null
  character: null
  content: 假如，生活欺骗了你。你不要难过，不要悲伤。因为，它不止一次欺骗了你。
  created_at: 2020-04-16 21:28:04
  source: 网络
  uuid: 9f8e468c-0068-4469-bca3-5a86b5d1b934
- author: 落陈
  character: null
  content: 这世间太不公平了，我都已经完完全全失去你了，可你还拥有着我。
  created_at: 2020-07-19 22:21:32
  source: 落陈
  uuid: 6a833e0d-7dd7-4cb7-9184-47a7412ab934
- author: null
  character: null
  content: 如果你仲记得我，就返转头啦。
  created_at: 2020-04-15 16:33:03
  source: 刑事侦缉档案
  uuid: 297c2f75-5426-4315-b4a4-d154fe134934
- author: null
  character: null
  content: 这就跟看书一样。对书本来说，字符只是符号，但你的注意力让他们有了生气。
  created_at: 2023-08-21 14:04:17
  source: 莱拉是谁
  uuid: 5df1ee1c-9ad3-4bd8-8472-a727441ff234
- author: null
  character: null
  content: I'll be forced to trash 'em, may the best man win this.
  created_at: 2026-08-30 05:14:23
  source: METAMORPHOSIS
  uuid: 44830b13-37d3-42ce-a31c-3d7677508b34
- author: 廖伟志
  character: null
  content: 从无话不说，到无话可说。
  created_at: 2026-08-30 11:46:17
  source: 你有没有真的爱过我
  uuid: 5235c678-6c41-4e96-91a4-2733b88e1f34
- author: 碧水凌涛
  character: null
  content: 薄雾依枝残月，参宿舞千帆。
  created_at: 2026-05-12 21:14:57
  source: 水调歌头
  uuid: 0c2b3b64-9c56-4d63-b7de-67559818eb34
- author: null
  character: null
  content: 竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生。
  created_at: 2019-04-24 15:49:55
  source: 定风波
  uuid: 96485a63-94d6-4584-823e-504f2c0fe434
- author: null
  character: null
  content: 当朋友是不需要什么资格的。
  created_at: 2016-07-16 02:05:09
  source: 全职猎人
  uuid: 155654de-02dd-48fb-b39b-ca016cdf3934
- author: 如风过境
  character: null
  content: 希望你别像风，在我这里面掀起万翻般波澜，却又跟云去了远方。
  created_at: 2021-08-28 07:10:46
  source: 网易云
  uuid: c8f8f2f5-cc9b-49ea-854b-ea4559739034
- author: Randy Bennett
  character: null
  content: 抱着你一起飞翔。
  created_at: 2026-08-08 15:22:47
  source: 命运在手心（feat.初音ミク&洛天依）
  uuid: 8dca6cd0-9c28-4d58-8107-8b18b252a634
- author: 叔本华
  character: null
  content: 无论我们能活多久，我们能够享受的只有无法分割的此刻，此外别无其他。
  created_at: 2021-08-08 19:05:30
  source: 人生的智慧
  uuid: 8eef8fac-63ff-442c-b35e-e2de4d0be534
- author: 芥川龙之介
  character: null
  content: 我曾听说住在罗生门的恶鬼，是因为害怕人性的残忍而逃走的。
  created_at: 2021-02-14 18:21:08
  source: 《罗生门》
  uuid: 6968dfd3-b177-46a5-9105-23877fc91234
- author: null
  character: null
  content: 一直保持微笑是有诀窍的，那就是，在想哭的时候放声大哭。
  created_at: 2016-07-16 02:05:10
  source: 天使领域
  uuid: b680e319-6f08-487b-ae78-3ddbd1ecbf34
- author: 叔本华
  character: null
  content: 忘掉一个人的劣根性就像把千辛万苦赚来的钱扔掉一样。
  created_at: 2021-08-07 11:21:12
  source: 人生的智慧
  uuid: a3aad3af-9ae9-46af-9296-ceedca152d34
- author: 汪精卫
  character: null
  content: 引刀成一快，不负少年头。
  created_at: 2021-06-08 13:44:01
  source: 被逮口占
  uuid: 8646f38f-2442-446e-a746-5127e0365b34
- author: 阿多尼斯
  character: null
  content: 什么是尘土？从大地之肺发出的一声叹息。
  created_at: 2020-06-27 20:34:15
  source: 阿多尼斯诗集
  uuid: b9e6af8a-af98-4cef-bbfe-931efdaa0b34
- author: John Kell
  character: null
  content: Packed in a box that no one sees。
  created_at: 2026-08-29 22:27:39
  source: HEAVENLY JUMPSTYLE
  uuid: b2a0f76a-3d53-459d-b2c4-52be4ad7be34
- author: 刘嘉星
  character: null
  content: 昨天的爱已回不来却依然在心里徘徊。
  created_at: 2026-08-08 16:05:32
  source: 恋人
  uuid: 7300e19a-9238-4063-9b38-c88ec86db934
- author: 沉珂C.K&光光
  character: null
  content: 别飞向别人的床。
  created_at: 2026-08-07 16:20:46
  source: 飞向别人的床
  uuid: e7a3cc8d-25b1-4299-9c39-cec3ce729734
- author: 福禄寿FloruitShow
  character: null
  content: 所以生命啊，它璀璨如歌。
  created_at: 2023-05-14 19:55:59
  source: 我用什么把你留住
  uuid: 59f45a5c-3de3-4ec1-9817-db92fba13034
- author: null
  character: null
  content: 那便以我渺小的灵魂，为无穷的你写下这诗篇。
  created_at: 2023-02-09 23:01:22
  source: 星辰的怀念
  uuid: 627a63fc-2704-4dfd-9063-21316f9efb34
- author: 杨树人
  character: null
  content: 甩臭汗，丢了爱。
  created_at: 2026-08-27 22:41:40
  source: 闷雷
  uuid: 1d62a4c8-11f4-48d3-87c7-e7009e0cf934
- author: 柳柳
  character: null
  content: 他帮你驱散黑暗，我却带给你光明。可，你心里没有我。
  created_at: 2021-07-22 03:45:01
  source: Naya
  uuid: 70e5c716-4b42-404f-839f-546efbc1b734
- author: 双十
  character: null
  content: 祝愿每日会有太阳为你升起，把你当做诗的最后一行。
  created_at: 2022-03-22 16:25:51
  source: 黄昏下的乌鸦
  uuid: 45be5a61-87fa-47bb-8fcf-a895db80e534
- author: 契约千魂
  character: null
  content: 不管什么天气，记得随时带上自己的阳光；不管什么遭遇，记得内心装满开心的童话。
  created_at: 2020-04-08 18:22:21
  source: 契约千魂
  uuid: a857a1b4-cb76-4d43-a6a2-cfe44e678534
- author: 三九音域
  character: null
  content: 众生不曾渡我，我又为何要用自己的性命，去守护这‘众生’？
  created_at: 2025-05-10 08:19:13
  source: 我在精神病院学斩神
  uuid: c69c1a8a-66fd-40c5-9ee7-ffa462bae034
- author: 弗朗西斯·培根
  character: null
  content: 读书不是为了雄辩和驳斥，也不是为了轻信和盲从，而是为了思考和权衡。
  created_at: 2024-03-18 23:54:11
  source: 论学习
  uuid: c0b2062f-1ed0-450c-ae1a-4172b34c0634
- author: 马尔克斯
  character: null
  content: 笑声会传染，孤单会蔓延。
  created_at: 2021-10-01 10:53:14
  source: 百年孤独
  uuid: bf048261-a52a-4038-b081-01a954807234
- author: null
  character: null
  content: 有一个夜晚我烧毁了所有的记忆，从此我的梦就透明了；有一个早晨我扔掉了所有的昨天，从此我的脚步就轻盈了。
  created_at: 2020-12-06 22:51:20
  source: 泰戈尔
  uuid: 34272309-9c1e-44fd-b63b-843091769634
- author: null
  character: null
  content: 当两颗卫星的轨道偶尔交叉时，我们便这样相会了。
  created_at: 2020-01-30 15:53:49
  source: 斯普特尼克恋人
  uuid: 51864e3c-0f0a-4816-b11e-d4fc3e92ed34
- author: 李信
  character: null
  content: 火可熄而不可夺其热，士可伤却不可损其志。
  created_at: 2026-05-30 03:27:28
  source: 王者荣耀
  uuid: aea2d6d0-1e13-48d2-a10e-2033bdc05c34
- author: null
  character: null
  content: 此刻你充满了决心。
  created_at: 2026-05-25 16:47:41
  source: Undertale
  uuid: ddb261d2-34d5-43fe-9320-e21a7c3f1634
- author: null
  character: null
  content: 电脑高手，哈哈哈哈哈，你这嘴里蹦的都是几几年的形容词啊？
  created_at: 2017-09-22 20:59:34
  source: 三色绘恋
  uuid: 108e9b23-ed80-4622-9574-f0c406e77a34
- author: 马戏团团长
  character: null
  content: 梦想，就像星辰，你看得到，但你摸不到。
  created_at: 2024-07-30 09:10:41
  source: 熊出没
  uuid: 456db9d3-af25-43e2-a154-a06216ae0e34
- author: null
  character: null
  content: 相信十年后的八月，我们还会相遇。
  created_at: 2018-09-19 20:41:47
  source: 未闻花名
  uuid: 470b94ea-abc6-4748-ba59-4b57d0c3ef34
- author: null
  character: null
  content: 除了爱你，我什么都可以。
