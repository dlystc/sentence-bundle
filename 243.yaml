- author: 佚名
  character: null
  content: 云一样的思绪，飘过来又飘过去，最终还是落在我的手掌上。绚丽如霓霞，哀怨如晨雾。我看得清你，你看得清我，我们在同一地平线，做着不同的梦，我的梦白如花朵，你的梦红如晚霞。
