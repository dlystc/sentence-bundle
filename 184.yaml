- author: 樱花庄的宠物女孩​
  character: null
  content: 无聊的并不是时间，而是平庸无奇的我。
  created_at: 2022-02-05 05:22:25
  source: 樱花庄的宠物女孩
  uuid: 652fbc94-bf6f-4ff3-8c28-4e4f6a5c82b8
- author: null
  character: null
  content: 无人与我立黄昏，无人问我粥可温。 无人与我捻熄灯，无人共我书半生。 无人陪我夜已深，无人与我把酒分。 无人拭我相思痕，无人梦我与前尘。 无人陪我顾星辰，无人醒我茶已冷。
    无人听我述衷诚，无人解我心头梦。 无人伴我聆此声，无人愁我独行程。 回首向来萧瑟处，无人等在灯火阑珊处。
  created_at: 2020-12-06 23:01:52
  source: 网络
  uuid: a605995c-f797-41e1-a018-c0018bf648b8
