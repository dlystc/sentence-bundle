  source: 网络
  uuid: 52632189-2b8a-4342-8d18-01afccda4460
- author: 玛蒂达
  character: null
  content: 人生总是那么痛苦吗?还是只有小时候是这样?
  created_at: 2023-04-18 15:01:57
  source: 这个杀手不太冷
  uuid: 85b49df0-e102-4f41-9b7e-8d837755a360
- author: null
  character: null
  content: 此心光明，亦复何言
