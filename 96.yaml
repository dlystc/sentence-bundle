  content: 如何肯到清秋日，已带斜阳又带蝉。
  created_at: 2020-10-17 18:53:18
  source: 柳
  uuid: c3ab7e10-5de4-403e-9e55-c0b0366a1c60
- author: null
  character: null
  content: 管他不会说话还是不会交流，只要不放弃就一定能把意思传达给对方。
  created_at: 2016-12-07 12:55:47
  source: 学园救援团
  uuid: b1bd7e51-dd0c-44bf-9cf8-9bb43088e260
- author: null
  character: null
  content: 你所浪费的今天，是昨天死去的人奢望的明天。你所厌恶的现在，是未来的你回不去的曾经。
