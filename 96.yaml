  character: null
  content: 凌晨四点钟，我看见海棠花未眠，总觉得这时，你应该在我身边；凌晨五点钟，我还在失眠，而你，也不会对我有所思念；凌晨六点钟，太阳升起海平面，你不爱我，也没人听得见。
  created_at: 2021-08-14 15:23:16
  source: 花未眠
  uuid: be18e0c5-9606-4e28-8f44-8d67894cdd60
