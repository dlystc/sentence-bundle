- author: null
  character: null
  content: 去看生活，去看世界； 去目击伟大的历史事件； 去看穷人的面孔和骄傲者的姿态； 去看不同寻常的事物——机器、军队、群众、以及丛林中和月球上的阴影；
    去看人类的杰作——绘画、建筑和发明； 去看千里之外的世界，去看隐藏在高墙和房间内的事物，以及难以接近的危险事件； 去看那些被男人所爱着的女人们还有孩子；去看并且享受愉悦；
    去看并被感动； 去看并被教育……
